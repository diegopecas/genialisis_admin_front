<div class="modulo">
  <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [raiz]="'/'" [regresar]="regresar" [iconoTitulo]="'/assets/images/clientes.png'"></app-header>

  <div class="container-fluid mt-4 contenido">

    <!-- ================= PASO 1: CAPTURA + IA ================= -->
    <div *ngIf="paso === 1" class="paso-captura">
      <div class="card tarjeta">
        <div class="card-body text-center">
          <h4 class="titulo-paso">RUT del cliente</h4>
          <p class="descripcion">Toma la foto o sube el PDF del RUT. Lo leeremos automáticamente para prellenar los datos del cliente y de su representante legal.</p>

          <!-- Vista de cámara -->
          <div *ngIf="modoCamara" class="camara-container">
            <video #videoElement autoplay playsinline class="video"></video>
            <div class="camara-controles">
              <button type="button" class="btn btn-secondary" (click)="cambiarCamara()">
                <i class="fas fa-sync-alt"></i> Voltear
              </button>
              <button type="button" class="btn btn-primary" (click)="capturarFoto()">
                <i class="fas fa-camera"></i> Capturar
              </button>
              <button type="button" class="btn btn-light" (click)="detenerCamara(); modoCamara = false">
                Cancelar
              </button>
            </div>
          </div>

          <!-- Preview de la foto tomada / seleccionada -->
          <div *ngIf="!modoCamara && (previewUrl || archivoRut)" class="preview-container">
            <img *ngIf="previewUrl" [src]="previewUrl" alt="RUT" class="preview-img" />
            <div *ngIf="!previewUrl && archivoRut" class="preview-archivo">
              <i class="fas fa-file-pdf"></i>
              <span>{{ archivoRut.name }}</span>
            </div>
            <div class="preview-acciones">
              <button type="button" class="btn btn-outline-secondary" (click)="repetirToma()" *ngIf="camaraDisponible">
                <i class="fas fa-redo"></i> Repetir toma
              </button>
            </div>
          </div>

          <!-- Botones iniciales (sin cámara abierta ni archivo) -->
          <div *ngIf="!modoCamara && !archivoRut" class="opciones-captura">
            <button type="button" class="btn btn-primary btn-lg" (click)="activarCamara()" *ngIf="camaraDisponible">
              <i class="fas fa-camera"></i> Tomar foto
            </button>

            <label class="btn btn-outline-primary btn-lg mb-0">
              <i class="fas fa-upload"></i> Subir archivo
              <input type="file" accept="image/*,application/pdf" (change)="onFileSelected($event)" hidden />
            </label>
          </div>

          <canvas #canvasElement hidden></canvas>

          <!-- Acciones del paso 1 -->
          <div class="acciones-paso mt-4" *ngIf="!modoCamara">
            <button type="button" class="btn btn-success btn-lg" (click)="analizarRut()" [disabled]="!archivoRut || analizando">
              <span *ngIf="!analizando"><i class="fas fa-robot"></i> Leer con IA y continuar</span>
              <span *ngIf="analizando"><i class="fas fa-spinner fa-spin"></i> Analizando...</span>
            </button>
            <button type="button" class="btn btn-link" (click)="continuarManual()" [disabled]="analizando">
              Prefiero llenar manualmente
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= PASO 2: REVISIÓN DE DATOS ================= -->
    <div *ngIf="paso === 2" class="paso-datos">

      <!-- Datos del cliente -->
      <div class="card tarjeta mb-3">
        <div class="card-header seccion-header">
          <i class="fas fa-building"></i> Datos del cliente
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Tipo de identificación <span class="req">*</span></label>
              <select class="form-select" [(ngModel)]="cliente.id_tipo_identificacion" (ngModelChange)="onTipoClienteChange()" name="cliente_tipo_id">
                <option value="">Seleccione...</option>
                <option *ngFor="let t of listas.tiposIdentificacion" [value]="t.id">{{ t.nombre }}</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Número de identificación <span class="req">*</span></label>
              <div class="input-group">
                <input type="text" class="form-control" [ngModel]="cliente.numero_identificacion" (ngModelChange)="onNumeroClienteChange($event)" name="cliente_num_id" />
                <ng-container *ngIf="clienteEsNit">
                  <span class="input-group-text">DV</span>
                  <input type="text" class="form-control input-dv" [value]="cliente.digito_verificacion" readonly tabindex="-1" />
                </ng-container>
              </div>
            </div>

            <!-- Empresa (NIT): razón social -->
            <div class="col-md-6" *ngIf="clienteEsNit">
              <label class="form-label">Razón social <span class="req">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="cliente.razon_social" name="cliente_razon_social" />
            </div>

            <!-- Persona natural: nombres, fecha de nacimiento y género -->
            <ng-container *ngIf="!clienteEsNit">
              <div class="col-md-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" [(ngModel)]="cliente.fecha_nacimiento" name="cliente_fnac" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Género</label>
                <select class="form-select" [(ngModel)]="cliente.id_genero" name="cliente_genero">
                  <option value="">Seleccione...</option>
                  <option *ngFor="let g of listas.generos" [value]="g.id">{{ g.nombre }}</option>
                </select>
              </div>

              <div class="col-md-3">
                <label class="form-label">Primer nombre <span class="req">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="cliente.primer_nombre" name="cliente_pnom" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Segundo nombre</label>
                <input type="text" class="form-control" [(ngModel)]="cliente.segundo_nombre" name="cliente_snom" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Primer apellido <span class="req">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="cliente.primer_apellido" name="cliente_pape" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Segundo apellido</label>
                <input type="text" class="form-control" [(ngModel)]="cliente.segundo_apellido" name="cliente_sape" />
              </div>
            </ng-container>

            <div class="col-md-6">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" [(ngModel)]="cliente.direccion" name="cliente_direccion" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Ciudad</label>
              <select class="form-select" [(ngModel)]="cliente.id_ciudad" name="cliente_ciudad">
                <option value="">Seleccione...</option>
                <option *ngFor="let c of listas.ciudades" [value]="c.id">{{ c.nombre }}</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" [(ngModel)]="cliente.telefono" name="cliente_telefono" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" [(ngModel)]="cliente.correo_electronico" name="cliente_correo" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha de ingreso</label>
              <input type="date" class="form-control" [(ngModel)]="cliente.fecha_ingreso" name="cliente_fing" />
            </div>
          </div>
        </div>
      </div>

      <!-- Plan / año -->
      <div class="card tarjeta mb-3">
        <div class="card-header seccion-header">
          <i class="fas fa-layer-group"></i> Plan
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Plan <span class="req">*</span></label>
              <select class="form-select" [(ngModel)]="id_plan" name="plan" >
                <option value="">Seleccione...</option>
                <option *ngFor="let g of listas.planes" [value]="g.id">{{ g.nombre }}</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Año</label>
              <input type="number" class="form-control" [(ngModel)]="anno" name="anno" />
            </div>
          </div>
        </div>
      </div>

      <!-- Representantes -->
      <div class="card tarjeta mb-3">
        <div class="card-header seccion-header d-flex justify-content-between align-items-center">
          <span><i class="fas fa-users"></i> Representantes</span>
          <button type="button" class="btn btn-sm btn-outline-primary" (click)="agregarRepresentante()">
            <i class="fas fa-plus"></i> Agregar representante
          </button>
        </div>
        <div class="card-body">
          <div *ngFor="let ac of representantes; let i = index" class="representante-bloque" [class.inactivo]="!ac.incluir">
            <div class="representante-encabezado">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="ac.incluir" [name]="'incluir_' + i" [id]="'incluir_' + i" />
                <label class="form-check-label" [for]="'incluir_' + i">Registrar este representante</label>
              </div>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="quitarRepresentante(i)" *ngIf="representantes.length > 1">
                <i class="fas fa-trash"></i>
              </button>
            </div>

            <div class="row g-3" *ngIf="ac.incluir">
              <div class="col-md-3">
                <label class="form-label">Tipo de representante <span class="req">*</span></label>
                <select class="form-select" [(ngModel)]="ac.id_tipo_representante" [name]="'ac_tipo_' + i">
                  <option value="">Seleccione...</option>
                  <option *ngFor="let t of listas.tiposRepresentante" [value]="t.id">{{ t.icono }} {{ t.nombre }}</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Tipo de identificación <span class="req">*</span></label>
                <select class="form-select" [(ngModel)]="ac.id_tipo_identificacion" [name]="'ac_tipoid_' + i">
                  <option value="">Seleccione...</option>
                  <option *ngFor="let t of listas.tiposIdentificacion" [value]="t.id">{{ t.nombre }}</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Número de identificación <span class="req">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="ac.numero_identificacion" [name]="'ac_num_' + i" />
                <small class="ayuda">Será su usuario y clave del portal.</small>
              </div>
              <div class="col-md-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" [(ngModel)]="ac.telefono" [name]="'ac_tel_' + i" />
              </div>

              <div class="col-md-3">
                <label class="form-label">Primer nombre <span class="req">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="ac.primer_nombre" [name]="'ac_pnom_' + i" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Segundo nombre</label>
                <input type="text" class="form-control" [(ngModel)]="ac.segundo_nombre" [name]="'ac_snom_' + i" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Primer apellido <span class="req">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="ac.primer_apellido" [name]="'ac_pape_' + i" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Segundo apellido</label>
                <input type="text" class="form-control" [(ngModel)]="ac.segundo_apellido" [name]="'ac_sape_' + i" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Correo electrónico <span class="req" *ngIf="ac.autorizado_sistema">*</span></label>
                <input type="email" class="form-control" [(ngModel)]="ac.correo_electronico" [name]="'ac_correo_' + i" />
                <small class="ayuda" *ngIf="ac.autorizado_sistema">Obligatorio para el acceso al portal.</small>
              </div>

              <div class="col-md-6 d-flex align-items-end">
                <div class="checks-representante">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" [(ngModel)]="ac.es_responsable_pago" [name]="'ac_pago_' + i" [id]="'ac_pago_' + i" />
                    <label class="form-check-label" [for]="'ac_pago_' + i">Responsable de pago</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" [(ngModel)]="ac.autorizado_sistema" [name]="'ac_sistema_' + i" [id]="'ac_sistema_' + i" />
                    <label class="form-check-label" [for]="'ac_sistema_' + i">Acceso al portal</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Acciones del paso 2 -->
      <div class="acciones-finales">
        <button type="button" class="btn btn-light" (click)="volverAlPaso1()" [disabled]="guardando">
          <i class="fas fa-arrow-left"></i> Volver al RUT
        </button>
        <button type="button" class="btn btn-success btn-lg" (click)="guardar()" [disabled]="guardando">
          <span *ngIf="!guardando"><i class="fas fa-save"></i> Registrar cliente</span>
          <span *ngIf="guardando"><i class="fas fa-spinner fa-spin"></i> Registrando...</span>
        </button>
      </div>

    </div>
  </div>
</div>
